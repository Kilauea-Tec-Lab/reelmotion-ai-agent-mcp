version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: reelmotion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: reelmotion-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build: .
    container_name: reelmotion-api
    restart: unless-stopped
    # Keep API internal; expose via nginx on port 80
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./temp_files:/app/temp_files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X OPTIONS --connect-timeout 2 --max-time 5 http://nginx/api/chat > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local
